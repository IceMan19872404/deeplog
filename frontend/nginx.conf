# Keep the original scheme when Caddy terminates TLS in front of Nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Static files carry ?v=<version> and the version is bumped whenever the file
# changes (tests/pwa-shell.test.js), so a versioned URL never changes content:
# cache it for a year. Unversioned files are revalidated on every use.
map $arg_v $asset_cache_control {
    ""      "no-cache";
    default "public, max-age=31536000, immutable";
}

# HTML is revalidated (no-cache keeps the back/forward cache usable), except
# URLs that carry a share or password-reset token, which are never stored.
map "$arg_share$arg_resetToken" $html_cache_control {
    ""      "no-cache";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 42m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }

    # add_header in this block replaces the ones from location /, hence nosniff
    # again. Cache-Control is not "always": a 404 must not be cached for a year.
    location ~ ^/(?:js|styles|fonts|assets)/ {
        add_header Cache-Control $asset_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control $html_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
